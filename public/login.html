<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PNC Selection System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 6px;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }
        .result.show { display: block; }
        .result.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .result.error { background: #fbe9e7; color: #c62828; border: 1px solid #ffccbc; }
        .result.loading { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .result.warning { background: #fff8e1; color: #f57f17; border: 1px solid #ffecb3; }
        .token-box {
            background: #f5f5f5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            word-break: break-all;
            margin-top: 10px;
            color: #333;
        }
        .credentials {
            background: #f8f9ff;
            border: 1px solid #e8eaff;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
        }
        .credentials p {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        .cred-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
            color: #333;
        }
        .cred-row .email { font-weight: 600; color: #444; }
        .cred-row .pw { color: #667eea; font-family: monospace; }
        .divider {
            border: none;
            border-top: 1px solid #e8eaff;
            margin: 8px 0;
        }

        /* URL bar */
        .url-bar {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 13px;
            font-family: monospace;
            color: #333;
            word-break: break-all;
        }
        .url-bar .label {
            font-size: 11px;
            color: #888;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: block;
            margin-bottom: 4px;
        }
        .url-bar .ok { color: #2e7d32; }
        .url-bar .bad { color: #c62828; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Login</h1>
        <p class="subtitle">PNC Selection System API</p>

        <!-- URL status bar -->
        <div id="urlBar" class="url-bar">
            <span class="label">🔍 Checking connection...</span>
        </div>

        <div class="credentials">
            <p><strong>👤 Available Accounts</strong></p>
            <div class="cred-row">
                <span>👑 <span class="email">admin@gmail.com</span></span>
                <span class="pw">admin123</span>
            </div>
            <hr class="divider">
            <div class="cred-row">
                <span>👔 <span class="email">manager@gmail.com</span></span>
                <span class="pw">manager123</span>
            </div>
            <hr class="divider">
            <div class="cred-row">
                <span>🛡️ <span class="email">officer@gmail.com</span></span>
                <span class="pw">officer123</span>
            </div>
        </div>

        <form onsubmit="login(); return false;">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="admin@gmail.com" autocomplete="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="admin123" autocomplete="current-password" placeholder="Enter your password">
            </div>

            <button id="loginBtn" type="submit">🔑 Login</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = window.location.protocol === 'file:' 
            ? 'http://localhost:8000/api/auth/login'
            : '/api/auth/login';

        // Check URL on page load
        window.addEventListener('DOMContentLoaded', function() {
            const urlBar = document.getElementById('urlBar');
            const currentUrl = window.location.href;
            const protocol = window.location.protocol;

            if (protocol === 'file:') {
                urlBar.innerHTML = `
                    <span class="label">⚠️ PROBLEM DETECTED</span>
                    <span class="bad">You opened this file from your computer (file://)</span><br>
                    <span style="color:#555;font-size:12px;">
                        The login page must be opened through the Laravel server.<br><br>
                        <strong>✅ Solution:</strong><br>
                        1. Open your terminal<br>
                        2. Run: <code style="background:#e8e8e8;padding:2px 6px;border-radius:3px;">php artisan serve</code><br>
                        3. Then open this URL in your browser:<br>
                        <a href="http://localhost:8000/login.html" style="color:#667eea;">http://localhost:8000/login.html</a>
                    </span>
                `;
            } else {
                urlBar.innerHTML = `
                    <span class="label">✅ SERVER CONNECTED</span>
                    <span class="ok">${currentUrl}</span>
                `;
            }
        });

        async function login() {
            const btn = document.getElementById('loginBtn');
            const result = document.getElementById('result');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = '⏳ Logging in...';
            result.className = 'result loading show';
            result.innerHTML = `Sending request to ${API_URL}...`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    result.className = 'result success show';
                    result.innerHTML = `
                        <strong>✅ Login Successful!</strong><br>
                        👤 ${data.data.user.name}<br>
                        📧 ${data.data.user.email}<br>
                        🏷️ Role: ${data.data.user.role}<br>
                        🔑 Permissions: ${data.data.permissions.length}
                        <div class="token-box">Token: ${data.data.access_token.substring(0, 60)}...</div>
                    `;
                    localStorage.setItem('jwt_token', data.data.access_token);
                } else {
                    result.className = 'result error show';
                    result.innerHTML = `
                        <strong>❌ Login Failed</strong><br>
                        ${data.message || 'Unknown error'}<br><br>
                        <strong>Tips:</strong><br>
                        • Use one of the emails from the list above<br>
                        • Check that passwords are typed correctly<br>
                        • Try copying and pasting: <code>admin@gmail.com</code> / <code>admin123</code>
                    `;
                }
            } catch (error) {
                result.className = 'result error show';
                result.innerHTML = `
                    <strong>❌ Network Error</strong><br>
                    ${error.message}<br><br>
                    <strong>Make sure the server is running!</strong><br>
                    Open a <strong>new terminal</strong> and run:<br>
                    <code style="display:block;background:#f5f5f5;padding:8px 12px;border-radius:6px;margin:8px 0;">
                    cd C:\Users\SOKKEANG.YEANG\Desktop\pnc-selection-system-api<br>
                    php artisan serve
                    </code>
                    Then refresh this page at <strong>http://localhost:8000/login.html</strong>
                `;
            }

            btn.disabled = false;
            btn.textContent = '🔑 Login';
        }
    </script>
</body>
</html>
