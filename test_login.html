<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>Login Test Page</h1>
    <p>This page tests the login API directly from your browser.</p>
    
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="admin@gmail.com" placeholder="Enter email">
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="admin123" placeholder="Enter password">
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result" class="result"></div>
    
    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '⏳ Sending request to http://localhost:8000/api/auth/login...';
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✓ Login Successful!</strong><br><br>
                        <strong>Token:</strong> ${data.data.access_token.substring(0, 50)}...<br>
                        <strong>User:</strong> ${data.data.user.name}<br>
                        <strong>Role:</strong> ${data.data.user.role}
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>✗ Login Failed</strong><br><br>
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Message:</strong> ${data.message || 'Unknown error'}<br><br>
                        <strong>Full Response:</strong><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>✗ Network Error</strong><br><br>
                    <strong>Error:</strong> ${error.message}<br><br>
                    <strong>Possible causes:</strong><br>
                    • Laravel server is not running on port 8000<br>
                    • CORS is blocking the request<br>
                    • Firewall is blocking the connection<br>
                    • Wrong API URL<br><br>
                    <strong>Solution:</strong><br>
                    1. Make sure Laravel is running: <code>php artisan serve --host=0.0.0.0 --port=8000</code><br>
                    2. Check browser console (F12) for detailed errors
                `;
            }
        }
        
        // Auto-test on page load
        window.addEventListener('load', () => {
            setTimeout(testLogin, 500);
        });
    </script>
</body>
</html>
